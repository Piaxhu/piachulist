<!DOCTYPE html>
<html lang="pl"><head>
<script>if(location.protocol!=="file:"&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))location.replace("list.html");</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piachulist — Admin</title><link rel="stylesheet" href="style.css"><link rel="shortcut icon" href="icon.png"/></head>
<body data-page="admin">
<header class="top"><a class="brand" href="list.html"><img src="new_piachulist.png" alt="PIACHULIST"></a>
<nav><a href="list.html?view=list">Main List</a><a href="progress.html">Progress</a><a href="changelog.html">Changelog</a></nav></header>
<main class="admin">
<section class="hero"><p class="eyebrow">Panel admina</p><h1>Zmień <span>listę.</span></h1>
<p class="lead">Ta strona niczego nie zapisuje sama. Robisz zmiany, kopiujesz gotowy <code>data.js</code>, wklejasz go do repo, potem <code>git commit</code> i <code>git push</code>.</p></section>
<div class="panel">
  <div class="seg" id="mode"><button data-m="list" class="on">Main List</button><button data-m="progress">Progress</button></div>
  <div class="chips" id="kind">
    <button data-m="list" data-k="add" class="on">＋ Dodaj poziom</button><button data-m="list" data-k="move">⇅ Przesuń poziom</button><button data-m="list" data-k="edit">✎ Edytuj poziom</button><button data-m="list" data-k="remove">✕ Usuń poziom</button>
    <button data-m="progress" data-k="add" hidden>＋ Dodaj poziom</button><button data-m="progress" data-k="edit" hidden>✎ Edytuj poziom</button><button data-m="progress" data-k="remove" hidden>✕ Usuń poziom</button>
  </div>
  <div class="form">
    <label data-for="add move remove">Data <input id="date" type="date"></label>
    <div data-for="move remove edit" hidden><label>Poziom <select id="lvl"></select></label></div>
    <div data-for="add edit"><label>Nazwa <input id="name"></label><label>Twórca <input id="creator"></label>
      <label>Trudność <select id="diff"></select></label><label>Miniatura (URL lub thumbnails/plik.png) <input id="thumb"></label>
      <label>Link do przejścia (opcjonalnie) <input id="link"></label>
      <label data-for="edit" style="display:flex;align-items:center;gap:8px"><input id="hard" type="checkbox" style="width:auto"> Oznacz jako 🥇 HARDEST</label></div>
    <div data-for="add move"><label>Miejsce (#) <input id="pos" type="number" min="1"></label></div>
    <div data-for="p-edit p-remove" hidden><label>Poziom <select id="plvl"></select></label></div>
    <div data-for="p-add p-edit" hidden><label>Nazwa <input id="pname"></label><label>Twórca <input id="pcreator"></label>
      <label>Estimated (top ile, np. 3 lub 2/3) <input id="pest"></label><label>Miniatura (URL lub thumbnails/plik.png) <input id="pthumb"></label>
      <label>Best run (np. 35 lub 20-100) <input id="pbest"></label>
      <label class="wide">Runy (np. 50-56%, 64-100%) <input id="pruns"></label></div>
    <button id="apply" class="go" type="button">Zastosuj zmianę</button><p id="msg" class="msg"></p>
  </div>
</div>
<div class="panel"><h3>Zmiany w tej sesji <button id="undo" type="button">↶ Cofnij ostatnią</button></h3><div id="pending" class="pending"></div></div>
<div class="panel"><h3>Nowy data.js
  <span><button id="vsc" type="button" title="Otwiera data.js w VS Code (tylko gdy admin.html jest otwarty z dysku)">Otwórz w VS Code</button> <button id="copy" type="button">Kopiuj</button> <button id="dl" type="button">Pobierz</button></span></h3>
  <textarea id="out" readonly rows="10"></textarea><p id="msg2" class="msg"></p></div>
</main>
<script src="data.js"></script><script src="shared.js"></script><script src="admin.js"></script>
</body></html>
